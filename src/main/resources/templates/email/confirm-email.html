<!DOCTYPE html>
<!--/* HTML part of the confirmation email. Inline styles only: mail clients ignore stylesheets. */-->
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Confirm your email address</title>
</head>
<body style="margin:0;padding:24px;background:#f8fafc;color:#0f172a;font-family:Arial,Helvetica,sans-serif;">
<table role="presentation" width="100%" cellpadding="0" cellspacing="0">
    <tr>
        <td align="center">
            <table role="presentation" width="480" cellpadding="0" cellspacing="0"
                   style="max-width:480px;background:#ffffff;border:1px solid #e2e8f0;border-radius:8px;">
                <tr>
                    <td style="padding:24px;">
                        <h1 style="margin:0 0 16px;font-size:20px;">Confirm your email address</h1>
                        <p style="margin:0 0 16px;font-size:15px;line-height:1.5;">
                            Hi <span th:text="${username}">there</span>,
                        </p>
                        <p style="margin:0 0 24px;font-size:15px;line-height:1.5;">
                            Confirm your email address to finish setting up your account.
                        </p>
                        <p style="margin:0 0 24px;">
                            <a th:href="${confirmationUrl}" href="#"
                               style="display:inline-block;padding:10px 20px;background:#047857;color:#ffffff;
                                      text-decoration:none;border-radius:6px;font-size:15px;font-weight:bold;">
                                Confirm email address
                            </a>
                        </p>
                        <p style="margin:0 0 8px;font-size:13px;line-height:1.5;color:#475569;">
                            Or copy this link into your browser:
                        </p>
                        <p style="margin:0 0 24px;font-size:13px;line-height:1.5;word-break:break-all;">
                            <a th:href="${confirmationUrl}" th:text="${confirmationUrl}" href="#"
                               style="color:#047857;">link</a>
                        </p>
                        <p style="margin:0;font-size:13px;line-height:1.5;color:#475569;">
                            This link expires in <span th:text="${expiresInHours}">24</span> hours.
                            If you didn't create an account, you can ignore this email.
                        </p>
                    </td>
                </tr>
            </table>
        </td>
    </tr>
</table>
</body>
</html>
