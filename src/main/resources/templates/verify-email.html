<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: pageHead('Confirm your email')}"></head>
<body>
<nav th:replace="~{fragments/layout :: topNav(${section})}"></nav>

<main class="container auth">
    <h1>Confirm your email</h1>

    <th:block th:if="${failed}">
        <div class="alert alert-error" role="alert">
            This confirmation link is invalid, has expired, or has already been used.
        </div>
        <p class="muted center"><a th:href="@{/verify-email/resend}">Send a new confirmation link</a></p>
    </th:block>

    <th:block th:unless="${failed}">
        <th:block th:if="${#strings.isEmpty(token)}">
            <div class="alert alert-error" role="alert">This link is missing its confirmation code.</div>
            <p class="muted center"><a th:href="@{/verify-email/resend}">Send a new confirmation link</a></p>
        </th:block>

        <!--/* Confirmation happens on POST, so link scanners that prefetch the GET can't consume the token. */-->
        <form th:unless="${#strings.isEmpty(token)}" th:action="@{/verify-email}" method="post" class="card form">
            <p>Select the button to confirm this email address for your account.</p>
            <input type="hidden" name="token" th:value="${token}">
            <button type="submit" class="btn btn-primary btn-block">Confirm email address</button>
        </form>
    </th:block>
</main>

<footer th:replace="~{fragments/layout :: pageFooter}"></footer>
</body>
</html>
